<!DOCTYPE html><html>
<head>
    <title>Form URL</title>
</head>
<body><h2>Form URL</h2>

<fieldset>
    <legend>URL</legend>

    <form>
        <p>
         URL:<input type="url" name="url" placeholder="Masukkan URL...">
        </p>

        <p>
         Tanggal:<input type="date" name="tanggal">
        </p>

        <p>
         Waktu:<input type="time" name="waktu">
        </p>

        <p>
         Jumlah:<input type="number" name="jumlah">
        </p>

        <input type="submit" value="Send">
        <input type="reset" value="Reset">
    </form>
</fieldset>

</body>
</html>
