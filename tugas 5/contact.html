<!DOCTYPE html><html>
<head>
    <title>Form Contact</title>
</head>
<body><h1>Form Contact</h1>

<fieldset>
    <legend>Contact</legend>

    <form>
        <p>
         Nama:<input type="text" name="nama" placeholder="Masukkan nama">
        </p>

        <p>
         Email:<input type="email" name="email" placeholder="Masukkan email">
        </p>

        <p>
         Subject:<input type="text" name="subject" placeholder="Masukkan subject">
        </p>

        <p>
          Pesan:<br>
          <textarea name="pesan" rows="8" cols="58" placeholder="Tulis pesan Anda..."></textarea>
        </p>

        <input type="submit" value="Send">
        <input type="reset" value="Reset">
    </form>
</fieldset>

</body>
</html>
